      Theme</button>
    <div id="app">Loading US ➔ India 401(k) Blueprint...</div>
    <script>
      function isDarkEffective() {
        var attr = document.documentElement.getAttribute('data-theme');
        if (attr === 'dark') return true;
        if (attr === 'light') return false;
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      }

      function updateThemeToggleUI() {
        var btn = document.getElementById('theme-toggle-btn');
        if (!btn) return;
        var dark = isDarkEffective();
        btn.innerHTML = dark ? '☀️ Light' : '🌙 Dark';
        btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
      }

      function toggleTheme() {
        var currentDark = isDarkEffective();
        var nextTheme = currentDark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', nextTheme);
        localStorage.setItem('blueprint-theme', nextTheme);
        updateThemeToggleUI();
        // Reload to re-render Mermaid SVG palettes consistently
        window.location.reload();
      }

      // Auto-update toggle UI when DOM is ready
      document.addEventListener('DOMContentLoaded', updateThemeToggleUI);

      // Listen to OS system color scheme changes if user hasn't explicitly set a local preference
      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
          if (!localStorage.getItem('blueprint-theme')) {
            if (e.matches) {
              document.documentElement.setAttribute('data-theme', 'dark');
            } else {
              document.documentElement.removeAttribute('data-theme');
            }
            updateThemeToggleUI();
            window.location.reload();
          }
        });
      }

      // GitHub-Flavored Markdown Alerts Transformer (converts > [!NOTE], [!TIP], [!IMPORTANT], [!WARNING], [!CAUTION])
      function renderGitHubAlerts() {
        var alerts = {
          note: {
            label: 'Note',
            icon: '<svg class="octicon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm8-6.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM6.5 7.75A.75.75 0 0 1 7.25 7h1a.75.75 0 0 1 .75.75v2.75h.25a.75.75 0 0 1 0 1.5h-2a.75.75 0 0 1 0-1.5h.25v-2h-.25a.75.75 0 0 1-.75-.75ZM8 6a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"></path></svg>'
          },
          tip: {
            label: 'Tip',
            icon: '<svg class="octicon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 1.5c-2.363 0-4 1.69-4 3.75 0 .984.424 1.625.984 2.304l.214.253c.223.264.47.556.673.848.284.411.537.896.621 1.49a.75.75 0 0 1-1.484.211c-.04-.282-.163-.547-.37-.847a8.456 8.456 0 0 0-.542-.68c-.628-.756-1.346-1.62-1.346-3.279C2.75 2.56 5.092 0 8 0s5.25 2.56 5.25 5.25c0 1.659-.718 2.523-1.346 3.279-.174.209-.348.423-.542.68-.207.3-.33.565-.37.847a.751.751 0 0 1-1.485-.211c.084-.594.337-1.079.621-1.49.204-.292.45-.584.673-.848.075-.088.147-.173.213-.253.561-.679.985-1.32.985-2.304 0-2.06-1.637-3.75-4-3.75ZM5.75 12h4.5a.75.75 0 0 1 0 1.5h-4.5a.75.75 0 0 1 0-1.5Zm1 3h2.5a.75.75 0 0 1 0 1.5h-2.5a.75.75 0 0 1 0-1.5Z"></path></svg>'
          },
          important: {
            label: 'Important',
            icon: '<svg class="octicon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M0 1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v9.5A1.75 1.75 0 0 1 14.25 13H9.06l-2.573 2.573A1.458 1.458 0 0 1 4 14.543V13H1.75A1.75 1.75 0 0 1 0 11.25Zm1.75-.25a.25.25 0 0 0-.25.25v9.5c0 .138.112.25.25.25h2.5a.75.75 0 0 1 .75.75v2.19l2.72-2.72a.749.749 0 0 1 .53-.22h6.5a.25.25 0 0 0 .25-.25v-9.5a.25.25 0 0 0-.25-.25Zm7 2.25v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 9a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"></path></svg>'
          },
          warning: {
            label: 'Warning',
            icon: '<svg class="octicon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M6.457 1.047c.659-1.234 2.427-1.234 3.086 0l6.082 11.378A1.75 1.75 0 0 1 14.082 15H1.918a1.75 1.75 0 0 1-1.543-2.575Zm1.763.707a.25.25 0 0 0-.44 0L1.698 13.132a.25.25 0 0 0 .22.368h12.164a.25.25 0 0 0 .22-.368Zm.53 3.996v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 11a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"></path></svg>'
          },
          caution: {
            label: 'Caution',
            icon: '<svg class="octicon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4.47.22A.749.749 0 0 1 5 0h6c.199 0 .389.079.53.22l4.25 4.25c.141.14.22.331.22.53v6c0 .199-.079.389-.22.53l-4.25 4.25a.749.749 0 0 1-.53.22H5a.749.749 0 0 1-.53-.22L.22 11.53A.749.749 0 0 1 0 11V5c0-.199.079-.389.22-.53Zm.84 1.28L1.5 5.31v5.38l3.81 3.81h5.38l3.81-3.81V5.31L10.69 1.5ZM8 4a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 4Zm0 8a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"></path></svg>'
          }
        };

        var bqs = document.querySelectorAll('.markdown-section blockquote');
        bqs.forEach(function (bq) {
          if (bq.classList.contains('markdown-alert')) return;
          var p = bq.querySelector('p');
          if (!p) return;
          var match = p.innerHTML.match(/^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\](?:\s*<br\s*\/?>|\s*\n)?\s*/i);
          if (match) {
            var key = match[1].toLowerCase();
            var alertConfig = alerts[key] || alerts.note;
            bq.classList.add('markdown-alert', 'markdown-alert-' + key);
            p.innerHTML = p.innerHTML.replace(/^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\](?:\s*<br\s*\/?>|\s*\n)?\s*/i, '');
            if (p.innerHTML.trim() === '') {
              p.remove();
            }
            var titleElem = document.createElement('p');
            titleElem.className = 'markdown-alert-title';
            titleElem.innerHTML = alertConfig.icon + ' ' + alertConfig.label;
            bq.insertBefore(titleElem, bq.firstChild);
          }
        });
      }

      window.$docsify = {
        name: '401(k) Blueprint',
        repo: 'https://github.com/mradityagoyal/us-india-401k-blueprint',
        loadSidebar: true,
        subMaxLevel: 3,
        auto2top: true,
        homepage: 'README.md',
        search: {
          maxAge: 86400000,
          paths: 'auto',
          placeholder: 'Search Blueprint...',
          noData: 'No results found',
          depth: 4
        },
        copyCode: {
          buttonText: 'Copy',
          errorText: 'Error',
          successText: 'Copied'
        },
        plugins: [
          function (hook) {
            hook.doneEach(function () {
              // Ensure Docsify content has github-markdown-css class
              var article = document.querySelector('.markdown-section');
              if (article && !article.classList.contains('markdown-body')) {
                article.classList.add('markdown-body');
              }

              // Track pageviews on SPA route changes (e.g., #/ and #/TECHNICAL_DESIGN_DOCUMENT)
              if (typeof gtag === 'function') {
                gtag('event', 'page_view', {
                  page_title: document.title,
                  page_location: window.location.href,
                  page_path: window.location.hash || '/'
                });
              }

              renderGitHubAlerts();
              updateThemeToggleUI();
            });
          }
        ]
      }
    </script>
